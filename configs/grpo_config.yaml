# GRPO Training Configuration for Code LLM
# Based on DeepSeek-R1 style training
# Optimized for A10 24GB GPU (single GPU) or multi-GPU setup
# Using general LLM (not Coder) to measure GRPO improvement

# =============================================================================
# Model Configuration
# =============================================================================
model:
  # Initial policy model - using base model directly (no SFT)
  # This allows direct comparison: Base vs GRPO
  pretrain: "Qwen/Qwen2.5-1.5B-Instruct"

  trust_remote_code: true
  bf16: true
  flash_attention: true

# =============================================================================
# GRPO Algorithm Configuration
# =============================================================================
grpo:
  # Advantage estimation method
  # Options: group_norm (GRPO), reinforce, rloo
  advantage_estimator: "group_norm"

  # Number of samples per prompt for group-relative advantage
  # DeepSeek uses 16, reduced to 4 for A10 24GB
  n_samples_per_prompt: 4

  # KL divergence coefficient (penalty term)
  # Low value allows more exploration
  init_kl_coef: 0.001

  # PPO clip ratio (epsilon)
  # Standard PPO value
  cliprange: 0.2

  # Reward normalization
  normalize_reward: true

# =============================================================================
# Training Configuration
# =============================================================================
training:
  # Batch sizes - reduced for A10 24GB memory constraints
  # train_batch_size: unique questions per step
  train_batch_size: 2

  # micro_train_batch_size: samples per GPU forward pass
  micro_train_batch_size: 1

  # Effective rollout batch = train_batch_size * n_samples_per_prompt
  # 8 * 4 = 32 samples per training step

  # Learning rate (DeepSeek-R1 uses 3e-6)
  actor_learning_rate: 3.0e-6
  lr_scheduler: "cosine"
  warmup_ratio: 0.1

  # Training duration
  max_epochs: 1
  num_episodes: 5000  # Reduce for faster iteration

  # Checkpointing
  save_steps: 500
  logging_steps: 10

  # Optimization
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Memory optimization
  gradient_checkpointing: true

  # Output directory
  output_dir: "./outputs/qwen-coder-grpo"

# =============================================================================
# Generation Configuration
# =============================================================================
generation:
  # Token limits - reduced for A10 24GB memory
  prompt_max_len: 512
  generate_max_len: 512

  # Sampling parameters for exploration
  temperature: 1.0
  top_p: 0.95
  do_sample: true

  # Stop sequences
  stop_sequences:
    - "<|im_end|>"
    - "```\n\n"

# =============================================================================
# Reward Configuration
# =============================================================================
reward:
  # Custom reward function path
  reward_func_path: "./rewards/reward_func.py"

  # Sandbox settings for code execution
  sandbox:
    timeout: 10  # seconds per execution
    memory_limit: "256m"
    cpu_limit: 1.0

  # Reward values
  pass_reward: 1.0
  fail_reward: 0.0
  timeout_reward: -0.5
  error_reward: -0.5

# =============================================================================
# Data Configuration
# =============================================================================
data:
  # Training prompts (Combined: MBPP + CodeContests = 3874 problems)
  prompt_data: "./data/rl_prompts/combined_rl_prompts.jsonl"

  # Column names in dataset
  input_key: "prompt"
  label_key: "test_cases"

  # Data processing
  max_samples: 50000
  seed: 42

# =============================================================================
# Distributed Training (for multi-GPU)
# =============================================================================
distributed:
  # DeepSpeed ZeRO stage
  zero_stage: 2

  # vLLM for fast generation (if using)
  vllm_num_engines: 1
  vllm_tensor_parallel_size: 1
  vllm_gpu_memory_utilization: 0.4

# =============================================================================
# Logging & Monitoring
# =============================================================================
logging:
  report_to: "tensorboard"  # or "wandb"
  wandb_project: "code-llm-grpo"
  wandb_run_name: "qwen-coder-grpo"
  log_interval: 10

