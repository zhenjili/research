# GRPO Training Configuration - 0.5B Model
# Optimized for fast iteration with small model
# Hardware: 8x A100 80GB (can use more aggressive settings)

# =============================================================================
# Model Configuration
# =============================================================================
model:
  # Smallest Qwen model for fastest iteration
  pretrain: "Qwen/Qwen2.5-0.5B-Instruct"

  trust_remote_code: true
  bf16: true
  flash_attention: true

# =============================================================================
# GRPO Algorithm Configuration
# =============================================================================
grpo:
  # Advantage estimation method
  advantage_estimator: "group_norm"

  # Number of samples per prompt for group-relative advantage
  # Use more samples with small model for better advantage estimation
  n_samples_per_prompt: 16

  # KL divergence coefficient (penalty term)
  init_kl_coef: 0.001

  # PPO clip ratio (epsilon)
  cliprange: 0.2

  # Reward normalization
  normalize_reward: true

  # Entropy coefficient for exploration bonus
  entropy_coef: 0.01

# =============================================================================
# Training Configuration
# =============================================================================
training:
  # Batch sizes - Can use larger batch with small model
  train_batch_size: 16  # 16 unique prompts per step

  # Larger micro batch size for small model
  micro_train_batch_size: 4  # 4 samples per GPU forward pass

  # Effective rollout batch = 16 * 16 = 256 samples per training step
  # Much larger than 3B model (96 samples)

  # Learning rate - can be higher for small model
  actor_learning_rate: 5.0e-6
  lr_scheduler: "cosine"
  warmup_ratio: 0.1

  # Training duration
  max_epochs: 1
  num_episodes: 100  # More episodes for better convergence

  # Checkpointing
  save_steps: 10  # Save every 10 episodes
  logging_steps: 1   # Log every episode

  # Optimization
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Memory optimization (less critical for small model)
  gradient_checkpointing: false  # Can disable for faster training

  # Output directory
  output_dir: "./outputs/qwen-0.5b-grpo-trl"

# =============================================================================
# Generation Configuration
# =============================================================================
generation:
  # Token limits - can be more generous with small model
  prompt_max_len: 1024
  generate_max_len: 1024

  # Sampling parameters for exploration
  temperature: 1.0
  top_p: 0.95
  do_sample: true

  # Stop sequences
  stop_sequences:
    - "<|im_end|>"
    - "```\n\n"

# =============================================================================
# Reward Configuration
# =============================================================================
reward:
  # Custom reward function path
  reward_func_path: "./rewards/reward_func.py"

  # Sandbox settings for code execution
  sandbox:
    timeout: 10  # seconds per execution
    memory_limit: "256m"
    cpu_limit: 1.0

  # Reward values
  pass_reward: 1.0
  fail_reward: 0.0
  timeout_reward: -0.5
  error_reward: -0.5

# =============================================================================
# Data Configuration
# =============================================================================
data:
  # Training prompts (Combined: MBPP + CodeContests = 3874 problems)
  prompt_data: "./data/rl_prompts/combined_rl_prompts.jsonl"

  # Column names in dataset
  input_key: "prompt"
  label_key: "test_cases"

  # Data processing
  max_samples: 50000
  seed: 42

# =============================================================================
# Distributed Training (for multi-GPU)
# =============================================================================
distributed:
  # DeepSpeed ZeRO stage (2 is sufficient for small model)
  zero_stage: 2

  # vLLM for fast generation
  vllm_num_engines: 2
  vllm_tensor_parallel_size: 2
  vllm_gpu_memory_utilization: 0.4  # Lower for small model

# =============================================================================
# Logging & Monitoring
# =============================================================================
logging:
  report_to: "tensorboard"
  wandb_project: "code-llm-grpo"
  wandb_run_name: "qwen-0.5b-grpo"
  log_interval: 10

# =============================================================================
# Expected Performance with 0.5B Model
# =============================================================================
# - Generation time: ~2-5 seconds (256 samples with vLLM)
# - Reward computation: ~10-20 seconds (parallel execution)
# - Training time: ~3-5 seconds (small model + ZeRO-2)
# - Total per episode: ~15-30 seconds
#
# Compared to 3B model:
# - 2x faster per episode
# - 3x more samples per step (256 vs 96)
# - Same or better GRPO advantages (more samples per group)
