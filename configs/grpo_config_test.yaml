# Quick test config with just 2 episodes
# Using 0.5B model for fastest testing
model:
  pretrain: "Qwen/Qwen2.5-0.5B-Instruct"
  trust_remote_code: true
  bf16: true
  flash_attention: true

grpo:
  advantage_estimator: "group_norm"
  n_samples_per_prompt: 2  # Reduced for quick test
  init_kl_coef: 0.001
  cliprange: 0.2
  normalize_reward: true
  entropy_coef: 0.01

training:
  train_batch_size: 2  # Just 2 prompts
  micro_train_batch_size: 1
  actor_learning_rate: 3.0e-6
  lr_scheduler: "cosine"
  warmup_ratio: 0.1
  max_epochs: 1
  num_episodes: 2  # Only 2 episodes for testing
  save_steps: 1  # Save each episode
  logging_steps: 1
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0
  gradient_checkpointing: true
  output_dir: "./outputs/qwen-grpo-test"

generation:
  prompt_max_len: 512
  generate_max_len: 512
  temperature: 1.0
  top_p: 0.95
  do_sample: true
  stop_sequences:
    - "<|im_end|>"
    - "```\n\n"

reward:
  reward_func_path: "./rewards/reward_func.py"
  sandbox:
    timeout: 10
    memory_limit: "256m"
    cpu_limit: 1.0
  pass_reward: 1.0
  fail_reward: 0.0
  timeout_reward: -0.5
  error_reward: -0.5

data:
  prompt_data: "./data/rl_prompts/combined_rl_prompts.jsonl"
  input_key: "prompt"
  label_key: "test_cases"
  max_samples: 50000
  seed: 42

distributed:
  zero_stage: 3
  vllm_num_engines: 2
  vllm_tensor_parallel_size: 2
  vllm_gpu_memory_utilization: 0.4

logging:
  report_to: "tensorboard"
  wandb_project: "code-llm-grpo"
  wandb_run_name: "qwen-grpo-test"
  log_interval: 1
